title = "Compass gitleaks configuration"

# Inherit every rule from the gitleaks default ruleset. We deliberately do NOT
# use `disabledRules` — each known false positive below is allowlisted by its
# specific value or line shape, so the underlying rule stays armed everywhere
# else in the repo.
[extend]
useDefault = true

# Vercel automation bypass values do not have a vendor-specific token prefix.
# Require the security-sensitive header/env name instead of relying on entropy.
# Whitespace may span lines; runtime environment references remain valid.
[[rules]]
id = "vercel-protection-bypass-literal"
description = "Literal Vercel protection bypass header credential"
regex = '''(?i)x-vercel-protection-bypass(?:["'\x60]\s*[:,]\s*["'\x60]|\s*:\s*)([a-z0-9_-]{16,})(?:["'\x60]|\s|$)'''
secretGroup = 1
keywords = ["x-vercel-protection-bypass"]

[[rules]]
id = "vercel-automation-bypass-assignment"
description = "Literal Vercel automation bypass environment credential"
regex = '''(?i)\b(?:vercel_automation_bypass_secret|compass_vercel_bypass_secret|mcp_bypass_secret)["'\x60]?\s*(?::\s*["'\x60]|=\s*["'\x60]?)([a-z0-9_-]{16,})(?:["'\x60]|\s|$)'''
secretGroup = 1
keywords = ["vercel_automation_bypass_secret", "compass_vercel_bypass_secret", "mcp_bypass_secret"]

# ---------------------------------------------------------------------------
# generic-api-key
#
# Our test suites use human-readable idempotency keys as fixtures
# (e.g. `idempotencyKey: "voice-hangup-0001"`). These are high-entropy enough
# to trip the generic detector but are not credentials.
#
# Scoped with condition = "AND": the finding is only ignored when it is BOTH
# inside a test path AND on a line declaring an idempotencyKey. A real API key
# committed to a test file is still reported.
# ---------------------------------------------------------------------------
[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Test-fixture idempotency keys are not credentials"
  condition = "AND"
  regexTarget = "line"
  regexes = ['''idempotencyKey''']
  paths = [
    '''__tests__/.*''',
    '''e2e/.*''',
    # docs/ is included so documentation can quote these fixtures verbatim.
    '''docs/.*''',
  ]

# ---------------------------------------------------------------------------
# private-key
#
# e2e/functional/fixtures/native-policy-config.ts contains a throwaway Ed25519
# keypair generated solely to sign policy fixtures inside the functional test
# suite. Its public half sits beside it in the same file and it grants no
# access to any real system.
#
# Allowlisted by the exact key material rather than by path, so ANY other
# private key — including a different one added to this same file — is still
# reported.
# ---------------------------------------------------------------------------
[[rules]]
id = "private-key"

  [[rules.allowlists]]
  description = "Throwaway Ed25519 keypair used to sign e2e policy fixtures"
  regexTarget = "secret"
  regexes = ['''MC4CAQAwBQYDK2VwBCIEIBKAvKc4PJgkE\+Xm3DfFRqk9dwgxhWf5C3liv7ypMIAF''']

# ---------------------------------------------------------------------------
# curl-auth-header
#
# The MCP API docs show an example request with a self-evident placeholder
# token. Matched on the placeholder shape (`your_..._here`) so that a real
# token pasted into the docs is still reported.
# ---------------------------------------------------------------------------
[[rules]]
id = "curl-auth-header"

  [[rules.allowlists]]
  description = "Documentation placeholder tokens"
  regexTarget = "secret"
  regexes = ['''(?i)your_[a-z0-9_]*_here''']

# ---------------------------------------------------------------------------
# vercel-protection-bypass (custom rule)
#
# A Vercel deployment-protection bypass secret is a bare alphanumeric string
# with no distinguishing prefix, and the header that carries it
# (`x-vercel-protection-bypass`) contains none of the keywords the default
# `generic-api-key` rule looks for. The result is that gitleaks with only the
# default ruleset does NOT flag a hardcoded bypass secret — verified by running
# the default ruleset against the fixtures in
# __tests__/gitleaks-vercel-bypass-rule.test.ts and getting zero findings.
#
# That combination — a high-value credential that the default ruleset is blind
# to — is what this rule exists to close.
# __tests__/playwright-config-security.test.ts already guards one file against
# it; this rule generalises the same protection to the whole repo and to every
# future commit.
#
# Matches the header form and the env-var-name form when either is assigned a
# quoted literal. The correct pattern — reading
# process.env.VERCEL_AUTOMATION_BYPASS_SECRET — has no quoted literal and so
# does not match.
# ---------------------------------------------------------------------------
[[rules]]
id = "vercel-protection-bypass"
description = "Vercel deployment-protection bypass secret assigned as a literal"
regex = '''(?i)(?:x-vercel-protection-bypass|vercel[_-]?automation[_-]?bypass[_-]?secret)["'\s]*[:=]\s*["']([A-Za-z0-9]{20,64})["']'''
secretGroup = 1
keywords = [
  "x-vercel-protection-bypass",
  "vercel_automation_bypass",
  "VERCEL_AUTOMATION_BYPASS",
]

# NOTE: this rule carries no value-specific allowlist, so a full-history scan
# (`pnpm scan:secrets`) will report any commit that ever carried a literal
# bypass secret, not just new ones. If a historical finding is triaged and its
# value confirmed dead, silence that one value with a
# `[[rules.allowlists]]` entry using `regexTarget = "secret"` pinned to it —
# never by weakening the regex, which would disarm the rule for new values too.

# ---------------------------------------------------------------------------
# Repo-wide allowlist
# ---------------------------------------------------------------------------
[allowlist]
description = "Global exclusions"
paths = [
  # Generated build/coverage output — never contains hand-written secrets and
  # is excluded from version control anyway. Listed so that `--no-git`
  # (working-tree) scans stay fast and quiet.
  '''(^|/)\.next/''',
  '''(^|/)coverage/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.worktrees/''',
]
