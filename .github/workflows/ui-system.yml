name: UI system

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm ui:colors
      - run: pnpm ui:primitives
      - run: pnpm ui:layers

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test --shard=${{ matrix.shard }}/4

  # Single stable check name for the whole fast-feedback group.
  checks:
    if: always()
    needs: [lint, typecheck, build, unit]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]

  authenticated-roadmap:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: compass_e2e
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d compass_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_SECRET: compass-ci-auth-secret-not-for-production
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/compass_e2e?sslmode=disable
      E2E_ISOLATED_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - run: pnpm test:e2e:roadmap
      - run: pnpm e2e:db:verify-clean
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-authenticated-roadmap-e2e
          path: |
            test-results
            public/screenshots/docs/native-timeline-*.png

  authenticated-capture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: compass_e2e
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d compass_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_SECRET: compass-ci-auth-secret-not-for-production
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/compass_e2e?sslmode=disable
      E2E_ISOLATED_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - run: pnpm test:e2e:functional -- e2e/functional/specs/capture-research.spec.ts e2e/functional/specs/research-browser-voice.spec.ts e2e/functional/specs/capture-results.spec.ts e2e/functional/specs/research-mcp.spec.ts e2e/functional/specs/capture-attachment-formats.spec.ts e2e/functional/specs/pm-interview.spec.ts e2e/functional/specs/card-sort.spec.ts
      - run: pnpm e2e:db:verify-clean
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-authenticated-capture-e2e
          path: |
            test-results
            public/screenshots/docs/pm-interview-*.png

  screenshots:
    if: ${{ vars.COMPASS_SCREENSHOT_BASE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - name: Restore screenshot session
        run: mkdir -p e2e/functional/.auth && printf '%s' "$SCREENSHOT_SESSION_BASE64" | base64 --decode > e2e/functional/.auth/screenshots.json
        env:
          SCREENSHOT_SESSION_BASE64: ${{ secrets.COMPASS_SCREENSHOT_SESSION_BASE64 }}
      - run: pnpm test:e2e
        env:
          DOCS_BASE_URL: ${{ vars.COMPASS_SCREENSHOT_BASE_URL }}
          DOCS_SESSION_FILE: e2e/functional/.auth/screenshots.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-ui-screenshots
          path: public/screenshots/docs
