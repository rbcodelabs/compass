name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Note: we install the gitleaks binary directly rather than using
# gitleaks/gitleaks-action. That action requires a paid GITLEAKS_LICENSE for
# repositories owned by an organization (rbcodelabs is one). The gitleaks CLI
# itself is MIT-licensed and free.
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — a secret is still a secret if it only exists in an
          # older commit, so scanning just the tip would defeat the point.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify secret scanning regressions
        run: node --test scripts/test-secret-scanning.mjs

      - name: Scan complete staged snapshot for secrets
        # Includes multiline context that a git diff may omit. Uses the same
        # fail-closed hook and staged policy as local commits; needs no pnpm install.
        run: sh scripts/hooks/pre-commit

      - name: Scan full git history for secrets
        run: |
          gitleaks git . \
            --log-opts="--all" \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      # Uploaded only on failure so a maintainer can inspect findings without
      # the secret values themselves being echoed into public build logs.
      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-findings
          path: gitleaks.sarif
